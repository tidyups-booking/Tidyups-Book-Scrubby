services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../backend
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - media_data:/data/storage
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    expose:
      - "9000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../frontend/build:/srv/tidyups-web:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  media_data:
  portainer_data:
  caddy_data:
  caddy_config:

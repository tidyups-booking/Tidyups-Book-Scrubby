name: EAS App Store and Google Play Build and Submit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-stores-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit-ios:
    name: Build and submit iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
          if [ -z "$ASC_API_KEY_P8_BASE64" ]; then
            echo "ASC_API_KEY_P8_BASE64 repository secret is required."
            exit 1
          fi

      - name: Create App Store Connect key
        working-directory: frontend
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > AuthKey_H7Y726A65W.p8
          chmod 600 AuthKey_H7Y726A65W.p8

      - name: Build and submit iOS app
        working-directory: frontend
        run: eas build --platform ios --profile production --auto-submit --non-interactive --wait

  build-and-submit-android:
    name: Build and submit Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 repository secret is required."
            exit 1
          fi

      - name: Create Google Play service account key
        working-directory: frontend
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > google-play-service-account.json
          chmod 600 google-play-service-account.json

      - name: Build and submit Android app
        working-directory: frontend
        run: eas build --platform android --profile production --auto-submit --non-interactive --wait

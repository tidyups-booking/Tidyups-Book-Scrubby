name: CI Health Checks

on:
  push:
    branches:
      - Main
      - develop
  pull_request:
    branches:
      - Main
      - develop
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: './frontend'

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/yarn.lock

      - name: Install frontend dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Run ESLint
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn lint

      - name: Build web application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/build
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/yarn.lock

      - name: Install frontend dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn audit --groups dependencies --level high

  summary:
    name: Workflow summary
    runs-on: ubuntu-latest
    needs:
      - quality
      - security
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## CI Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint and build | ${{ needs.quality.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency audit | ${{ needs.security.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
